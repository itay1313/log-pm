# Every push to main (a merged PR) builds the theme and uploads the theme and log-core to uPress over FTPS.
# Run it by hand from the Actions tab to deploy any branch for testing.
name: Deploy to uPress

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-upress
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wp-content/themes/log/package-lock.json

      - name: Install theme dependencies
        run: npm ci
        working-directory: wp-content/themes/log

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Build and upload
        run: ./tools/deploy.sh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
