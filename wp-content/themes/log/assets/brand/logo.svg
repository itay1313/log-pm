<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1005.832 380" width="1005.832" height="380">
<!-- LOG wordmark: a stand-in drawn by tools/logo-construct.py until LOG sends the master file.
     Colours: --logo-a (grey), --logo-b to --logo-b-deep (the orange gradient).
     Each orange piece has a grey twin. The orange shows through #logo_on, the grey through #logo_off;
     moving both rects sweeps the colour across. At rest the orange covers everything. -->
<defs>
<linearGradient id="logo_v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--logo-b,#f89e2d)"/><stop offset="1" style="stop-color:var(--logo-b-deep,#f67b1c)"/></linearGradient>
<linearGradient id="logo_d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-b-deep,#f67b1c)"/><stop offset="1" style="stop-color:var(--logo-b,#f89e2d)"/></linearGradient>
<linearGradient id="logo_h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--logo-b-deep,#f67b1c)"/><stop offset="1" style="stop-color:var(--logo-b,#f89e2d)"/></linearGradient>
<clipPath id="logo_on"><rect data-sweep="on" x="0" y="0" width="1005.832" height="380"/></clipPath>
<clipPath id="logo_off"><rect data-sweep="off" x="1005.832" y="0" width="0" height="380"/></clipPath>
</defs>
<g class="logo__q3" data-q="3"><path d="M 316.491 220 H 377.617 A 130 130 0 0 0 474.108 316.491 V 377.617 A 190 190 0 0 1 316.491 220 Z" clip-path="url(#logo_off)" style="fill:var(--logo-a,#77787b)"/><path d="M 316.491 220 H 377.617 A 130 130 0 0 0 474.108 316.491 V 377.617 A 190 190 0 0 1 316.491 220 Z" clip-path="url(#logo_on)" style="fill:url(#logo_d)"/></g>
<path class="logo__l-bowl" d="M 2.383 220 H 63.509 A 130 130 0 0 0 316.491 220 H 377.617 A 190 190 0 0 1 2.383 220 Z" style="fill:var(--logo-a,#77787b)"/>
<g class="logo__l-stem"><path d="M 0 0 H 60 V 160 H 0 Z" clip-path="url(#logo_off)" style="fill:var(--logo-a,#77787b)"/><path d="M 0 0 H 60 V 160 H 0 Z" clip-path="url(#logo_on)" style="fill:url(#logo_v)"/></g>
<path class="logo__q2" data-q="2" d="M 474.108 2.383 V 63.509 A 130 130 0 0 0 377.617 160 H 316.491 A 190 190 0 0 1 474.108 2.383 Z" style="fill:var(--logo-a,#77787b)"/>
<path class="logo__g-arm" d="M 630.599 160 A 190 190 0 0 1 818.215 0 H 1005.832 V 60 H 818.215 A 130 130 0 0 0 691.724 160 Z" style="fill:var(--logo-a,#77787b)"/>
<g class="logo__q1" data-q="1"><path d="M 534.108 2.383 A 190 190 0 0 1 691.724 160 H 630.599 A 130 130 0 0 0 534.108 63.509 Z" clip-path="url(#logo_off)" style="fill:var(--logo-a,#77787b)"/><path d="M 534.108 2.383 A 190 190 0 0 1 691.724 160 H 630.599 A 130 130 0 0 0 534.108 63.509 Z" clip-path="url(#logo_on)" style="fill:url(#logo_d)"/></g>
<path class="logo__q4" data-q="4" d="M 534.108 316.491 A 130 130 0 0 0 630.599 220 H 691.724 A 190 190 0 0 1 534.108 377.617 Z" style="fill:var(--logo-a,#77787b)"/>
<g class="logo__g-bowl"><path d="M 630.599 220 H 691.724 A 130 130 0 0 0 944.707 220 V 219 H 1005.832 V 220 A 190 190 0 0 1 630.599 220 Z" clip-path="url(#logo_off)" style="fill:var(--logo-a,#77787b)"/><path d="M 630.599 220 H 691.724 A 130 130 0 0 0 944.707 220 V 219 H 1005.832 V 220 A 190 190 0 0 1 630.599 220 Z" clip-path="url(#logo_on)" style="fill:url(#logo_h)"/></g>
<path class="logo__g-bar" d="M 869.615 160 H 1005.832 V 220 H 869.615 Z" style="fill:var(--logo-a,#77787b)"/>
</svg>
